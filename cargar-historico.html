function log(msg, cls='info') {
  const el = document.getElementById('log');
  el.classList.add('show');
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function fbSet(path, data) {
  try {
    const r = await fetch(`${DB_URL}/${path}.json?auth=${API_KEY}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    return r.ok;
  } catch { return false; }
}

async function cargar() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Cargando...';

  log('Iniciando carga de datos históricos...');

  // 1. Limpiar bandera de histórico para forzar re-inyección
  localStorage.removeItem('hist2025_injected');
  log('✓ Bandera hist2025_injected limpiada');

  // 2. Guardar contabilidad en localStorage
  const existContab = JSON.parse(localStorage.getItem('contabilidad') || '[]');
  const idsExist = new Set(existContab.map(r => r.id));
  const nuevos = CONTABILIDAD.filter(r => !idsExist.has(r.id));
  const merged = [...existContab, ...nuevos];
  localStorage.setItem('contabilidad', JSON.stringify(merged));
  log(`✓ Contabilidad: ${merged.length} registros en localStorage (${nuevos.length} nuevos)`,'ok');

  // 3. Guardar bodega en localStorage
  const existBodega = JSON.parse(localStorage.getItem('bodega') || '[]');
  const idsBod = new Set(existBodega.map(r => r.id));
  const nuevosBod = BODEGA.filter(r => !idsBod.has(r.id));
  const mergedBod = [...existBodega, ...nuevosBod];
  localStorage.setItem('bodega', JSON.stringify(mergedBod));
  log(`✓ Bodega: ${mergedBod.length} movimientos en localStorage (${nuevosBod.length} nuevos)`,'ok');

  // 4. Marcar histórico como inyectado
  localStorage.setItem('hist2025_injected', '1');

  // 5. Subir a Firebase
  log('Subiendo a Firebase...');
  const okC = await fbSet('data/contabilidad', merged);
  log(okC ? '✓ Contabilidad subida a Firebase' : '✗ Error subiendo contabilidad — se guardó en localStorage', okC?'ok':'err');

  const okB = await fbSet('data/bodega', mergedBod);
  log(okB ? '✓ Bodega subida a Firebase' : '✗ Error subiendo bodega — se guardó en localStorage', okB?'ok':'err');

  const now = new Date().toISOString();
  localStorage.setItem('last_sync', now);
  await fbSet('data/last_sync', now);

  log('');
  log('✅ ¡Listo! Cierra esta pestaña y abre PorciAdmin.','ok');
  btn.textContent = '✅ Datos cargados — cierra esta pestaña';
}
